[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ep-tta"
version = "0.1.0"
description = "Episodic test-time adaptation research workflow for audio anti-spoofing"
requires-python = ">=3.10,<3.11"
dependencies = [
  "numpy>=1.26,<2",
  "scipy>=1.13,<1.14",
  "PyYAML>=6,<7",
  "torch>=2.1,<2.2",
  "torchaudio>=2.1,<2.2",
  "soundfile>=0.12,<0.14",
]

[project.optional-dependencies]
author-models = [
  "fairseq==0.12.2",
  "librosa>=0.10,<0.11",
  "tensorboardX==2.5",
]
test = ["pytest>=9,<10"]

[project.scripts]
eptta = "eptta.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eptta = ["catalogs/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests/reference"]
testpaths = ["tests"]
addopts = "-ra"

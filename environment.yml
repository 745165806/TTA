name: tta
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10.20
  - pip
  - pytorch=2.1.0
  - torchaudio=2.1.0
  - pytorch-cuda=12.1
  - numpy=1.26.4
  - scipy=1.13
  - pyyaml=6.0
  - pysoundfile=0.12.1
  - librosa=0.10.2
  - tensorboardx=2.5
  - cffi
  - cython
  - regex
  - sacrebleu
  - tqdm
  - bitarray
  - pytest=9.1
  - pip:
      # Candidate common fairseq release. Real AASIST/SSL-AASIST loading in this
      # exact environment remains a required server-side verification step.
      - fairseq==0.12.2
      - hydra-core==1.0.7
      - omegaconf==2.0.6
      - httpx>=0.27,<1

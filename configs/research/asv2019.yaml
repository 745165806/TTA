{
  "schema_version": "0.1.0",
  "command": "prepare-data",
  "dataset": {
    "dataset_id": "asvspoof2019_la",
    "release": "ASVspoof2019-LA",
    "subset": "REPLACE_WITH_EXPLICIT_TRAIN_DEV_EVAL_SCOPE",
    "manifest": "@path:asv2019_manifest",
    "audio_root": "@path:asv2019_audio_root",
    "root_key": "asvspoof2019_la"
  },
  "columns": {
    "sample_id": "sample_id",
    "audio_relpath": "audio_relpath",
    "label": "label",
    "group_id": "source_group_id",
    "split_role": "split_role"
  },
  "label_map": {"bonafide": 0, "spoof": 1},
  "split": {"reuse_existing": true, "seed": 13},
  "output": "data/manifests/asv2019_la"
}
